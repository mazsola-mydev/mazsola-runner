name: 434 - Lottery (Full Runner)

on:
  schedule:
    - cron: '12 0 * * *'
  workflow_dispatch:   # manuális indítás lehetősége

jobs:
  load_data:
    runs-on: ubuntu-22.04

    steps:
      # 1. A privát repó letöltése a PAT Token segítségével
      - name: Checkout private repository
        uses: actions/checkout@v6
        with:
          repository: 'mazsola-mydev/lottery'
          token: ${{ secrets.CLASSIC_TOKEN }}

      # 2. Python környezet beállítása
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. MSSQL ODBC Driver 18 telepítése
      - name: Install ODBC Driver 18 for SQL Server
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl gnupg ca-certificates
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /etc/apt/keyrings/microsoft-prod.gpg
          OS_VERSION="$(. /etc/os-release && echo "$VERSION_ID")"
          CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${OS_VERSION}/prod ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      # 4. Python függőségek telepítése
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyodbc numpy sqlalchemy

      # 5. A privátból letöltött Python script futtatása
      # --- 1. LÉPÉS: Adatbetöltés ---
      - name: Run load script
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python load_lottery.py

      # --- 2. LÉPÉS: Számítás (csak akkor fut le, ha az 1. lépés sikeres volt) ---
      - name: Run prediction calculation script
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python calculate_predictions.py
