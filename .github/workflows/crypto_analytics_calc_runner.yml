name: Crypto Analytics Calculations Only (no collection)

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Teljes backfill az indikátorokhoz (true/false)'
        required: true
        default: 'true'

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      # --- ELŐKÉSZÜLETEK (Környezet felépítése) ---

      # 1. Privát kód letöltése
      - name: Checkout private repository
        uses: actions/checkout@v6
        with:
          repository: 'mazsola-mydev/crypto-analytics'
          token: ${{ secrets.CLASSIC_TOKEN }}

      # 2. Python 3.12 beállítása
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. MSSQL ODBC Driver 18 telepítése
      - name: Install ODBC Driver 18 for SQL Server
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      # 4. Összes szükséges Python függőség telepítése egy lépésben
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install polars pandas pyarrow requests sqlalchemy pyodbc python-dotenv loguru numpy scipy

      # --- LÉPÉSEK VÉGREHAJTÁSA (csak számítások, adatgyűjtés nélkül) ---

      # Step #1: Refresh Halving Analysis
      - name: "Step #1 - Refresh Halving Analysis"
        id: step1
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python refresh_halving.py

      # Step #2: Calculate Indicators
      - name: "Step #2 - Calculate Indicators"
        id: step2
        if: steps.step1.outcome == 'success'
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
          BACKFILL: ${{ github.event.inputs.backfill || 'true' }}
        run: python calculate_indicators.py

      # Step #3: Calculate Alerts
      - name: "Step #3 - Calculate Alerts"
        id: step3
        if: steps.step2.outcome == 'success'
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python calculate_alerts.py

      # Step #4: Calculate Clusters
      - name: "Step #4 - Calculate Clusters"
        id: step4
        if: steps.step3.outcome == 'success'
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python calculate_clusters.py

      # Step #5: Calculate Cluster Signals
      - name: "Step #5 - Calculate Cluster Signals"
        id: step5
        if: steps.step4.outcome == 'success'
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python calculate_cluster_signals.py

      # Step #6: Calculate Cycle (ciklus-fázis + vételi ajánlás, napi append)
      - name: "Step #6 - Calculate Cycle"
        id: step6
        if: steps.step5.outcome == 'success'
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python calculate_cycle.py

      # Step #7: Calculate Macro Cycle (4 éves halving-ciklus fázis)
      - name: "Step #7 - Calculate Macro Cycle"
        id: step7
        if: steps.step6.outcome == 'success'
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python calculate_macro_cycle.py
