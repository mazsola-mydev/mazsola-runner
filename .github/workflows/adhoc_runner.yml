name: Ad-hoc Script Runner

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Privát repó neve (pl. crypto-analytics vagy lottery)'
        required: true
        default: 'crypto-analytics'
        type: choice
        options:
          - 'crypto-analytics'
          - 'lottery'
      script_name:
        description: 'A lefuttatandó Python script neve (pl. calculate_indicators.py)'
        required: true
        default: 'script.py'

jobs:
  run_adhoc:
    runs-on: ubuntu-latest

    steps:
      # 1. A kiválasztott privát repó letöltése a PAT Token segítségével
      - name: Checkout private repository
        uses: actions/checkout@v6
        with:
          repository: 'mazsola-mydev/${{ inputs.repository }}'
          token: ${{ secrets.CLASSIC_TOKEN }}

      # 2. Python 3.12 környezet felépítése
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. MSSQL ODBC Driver 18 telepítése
      - name: Install ODBC Driver 18 for SQL Server
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      # 4. Az összes lehetséges függőség telepítése
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install polars pandas requests sqlalchemy pyodbc python-dotenv loguru

      # 5. A megadott script futtatása az ÖSSZES Secret átadásával
      - name: Run Ad-hoc Script
        env:
          # Adatbázis elérések
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
          # EODHD API kulcsok
          EODHD_API_KEY_00: ${{ secrets.EODHD_API_KEY_00 }}
          EODHD_API_KEY_01: ${{ secrets.EODHD_API_KEY_01 }}
          EODHD_API_KEY_02: ${{ secrets.EODHD_API_KEY_02 }}
          EODHD_API_KEY_03: ${{ secrets.EODHD_API_KEY_03 }}
          EODHD_API_KEY_04: ${{ secrets.EODHD_API_KEY_04 }}
          EODHD_API_KEY_05: ${{ secrets.EODHD_API_KEY_05 }}
          # FMP API kulcs
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # AlphaVantage API kulcs
          ALPHAVANTAGE_API_KEY_04: ${{ secrets.ALPHAVANTAGE_API_KEY_04 }}
          # Egyéb alapértelmezett beállítások
          BACKFILL: 'true'
        run: |
          echo "futtatás: ${{ inputs.repository }} / ${{ inputs.script_name }}"
          python ${{ inputs.script_name }}
